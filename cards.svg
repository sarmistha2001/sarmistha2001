<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 300" width="830" height="300" xmlns:c2pa="http://c2pa.org/manifest">
<style>.t{font:800 21px 'Segoe UI',Arial,sans-serif;fill:#F5F3FF}.d{font:13px 'Segoe UI',Arial,sans-serif;fill:#A5A0D6}.g{font:11px Consolas,monospace;fill:#FFB84D}.v{font:700 13px 'Segoe UI',Arial,sans-serif;fill:#22D3EE}
.fl{animation:b 4s ease-in-out infinite}@keyframes b{50%{transform:translateY(-6px)}}
.gl{animation:s 5s ease-in-out infinite}@keyframes s{0%{transform:translateX(-100px)}50%,100%{transform:translateX(520px)}}</style>
<defs><clipPath id="r"><rect width="400" height="118" rx="14"/></clipPath>
<g id="c"><rect x="8" y="10" width="400" height="118" rx="14" fill="#1B0F4D"/><rect x="4" y="5" width="400" height="118" rx="14" fill="#2E1A7A"/><rect width="400" height="118" rx="14" fill="#0A0820"/>
<rect width="400" height="118" rx="14" fill="none" stroke="#22D3EE" stroke-width="1.6" stroke-dasharray="1100" stroke-dashoffset="1100"><animate attributeName="stroke-dashoffset" to="0" dur="1.6s" fill="freeze"/></rect>
<g clip-path="url(#r)"><rect class="gl" y="-10" width="46" height="140" fill="#fff" opacity=".08" transform="skewX(-20)"/></g>
<g transform="translate(46 44)"><polygon points="0,-22 20,-11 0,0 -20,-11" fill="#22D3EE"/><polygon points="-20,-11 0,0 0,24 -20,13" fill="#7C3AED"/><polygon points="20,-11 0,0 0,24 20,13" fill="#F72585"/></g>
<rect x="24" y="92" width="54" height="22" rx="11" fill="#FFB84D" opacity=".18"/><text x="51" y="107" text-anchor="middle" class="g">HTML</text><text x="380" y="107" text-anchor="end" class="v">View repo</text></g></defs>
<g transform="translate(0 12)"><g class="fl" style="animation-delay:0s"><use href="#c"/><text x="92" y="42" class="t">Portfolio</text><text x="92" y="66" class="d">Personal site with projects, skills</text><text x="92" y="84" class="d">and resume in one responsive page.</text></g></g><g transform="translate(418 12)"><g class="fl" style="animation-delay:0.6s"><use href="#c"/><text x="92" y="42" class="t">Hotel Booking</text><text x="92" y="66" class="d">Booking page with room listings</text><text x="92" y="84" class="d">and a reservation form.</text></g></g><g transform="translate(0 160)"><g class="fl" style="animation-delay:1.2s"><use href="#c"/><text x="92" y="42" class="t">Amazon Login</text><text x="92" y="66" class="d">Pixel-matched clone of the Amazon</text><text x="92" y="84" class="d">sign-in page.</text></g></g><g transform="translate(418 160)"><g class="fl" style="animation-delay:1.8s"><use href="#c"/><text x="92" y="42" class="t">EMI Calculator</text><text x="92" y="66" class="d">Enter amount, rate and tenure to see</text><text x="92" y="84" class="d">your monthly loan payment.</text></g></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>